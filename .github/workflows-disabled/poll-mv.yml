name: Mecklenburg-Vorpommern Election Poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 2026-mv-minute-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUSH_TOKEN: ${{ secrets.WORKFLOW_WRITE_TOKEN != '' && secrets.WORKFLOW_WRITE_TOKEN || github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Mecklenburg-Vorpommern poller with retry
        run: |
          attempt=1
          max_attempts=3
          sleep_seconds=30

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Starting poll attempt $attempt/$max_attempts"
            if python scripts/poll_election.py --election-key 2026-mv --skip-kommone; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Poll failed after $max_attempts attempts"
              exit 1
            fi

            echo "Poll attempt $attempt failed, waiting ${sleep_seconds}s before retry"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Snapshot generated outputs
        run: |
          mkdir -p /tmp/poll-output/data/2026-mv/metadata
          mkdir -p /tmp/poll-output/data/2026-mv/reports
          cp -R data/2026-mv/latest /tmp/poll-output/data/2026-mv/
          cp data/2026-mv/metadata/municipalities.csv /tmp/poll-output/data/2026-mv/metadata/
          cp data/2026-mv/metadata/wahlkreis-status.csv /tmp/poll-output/data/2026-mv/metadata/
          cp data/2026-mv/reports/latest_events.csv /tmp/poll-output/data/2026-mv/reports/

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$default_branch"
          git checkout -B "$default_branch" "origin/$default_branch"
          rm -rf data/2026-mv/latest
          mkdir -p data/2026-mv/metadata
          mkdir -p data/2026-mv/reports
          cp -R /tmp/poll-output/data/2026-mv/latest data/2026-mv/
          cp /tmp/poll-output/data/2026-mv/metadata/municipalities.csv data/2026-mv/metadata/
          cp /tmp/poll-output/data/2026-mv/metadata/wahlkreis-status.csv data/2026-mv/metadata/
          cp /tmp/poll-output/data/2026-mv/reports/latest_events.csv data/2026-mv/reports/
          git add -A data/2026-mv/latest data/2026-mv/metadata data/2026-mv/reports
          git diff --cached --quiet && exit 0
          git commit -m "2026-mv poll $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          git push origin "HEAD:$default_branch"
