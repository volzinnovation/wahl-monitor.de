name: Election Poller Smoke Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile core scripts
        run: |
          python -m py_compile \
            scripts/poll_election.py \
            scripts/poll_election_core.py \
            scripts/generate_static_detail_pages.py \
            scripts/scenario_page.py \
            scripts/election_status.py \
            scripts/rlp_seat_allocation.py \
            scripts/test_rlp_seat_allocation.py
      - name: Print election artifact status
        run: python scripts/election_status.py --format json
      - name: Run RLP seat allocation self-tests
        run: python scripts/test_rlp_seat_allocation.py
      - name: Run LSA acquisition and versioning regression tests
        run: |
          python scripts/test_lsa_statla_csv.py
          python -m unittest discover -s scripts -p 'test_lsa_pipeline.py' -v
          python -m unittest discover -s scripts -p 'test_lsa_pages.py' -v
      - name: Parse BW fixture without polling or writing election results
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          import poll_election_core as core
          data = Path('data/2026-bw/metadata/2026021_LTW26-Dummy-Datei.csv').read_bytes()
          snapshots, parties = core.parse_statla_csv_rows(core.decode_bytes(data))
          assert len(snapshots) > 1000 and parties
          print(f'Parsed {len(snapshots)} BW fixture rows in memory; no files regenerated')
          PY
