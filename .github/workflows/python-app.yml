name: Election Poller Smoke Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile core scripts
        run: |
          python -m py_compile \
            scripts/poll_election.py \
            scripts/poll_election_core.py \
            scripts/generate_static_detail_pages.py \
            scripts/scenario_page.py \
            scripts/election_status.py \
            scripts/rlp_seat_allocation.py \
            scripts/test_rlp_seat_allocation.py
      - name: Print election artifact status
        run: python scripts/election_status.py --format json
      - name: Run RLP seat allocation self-tests
        run: python scripts/test_rlp_seat_allocation.py
      - name: Run LSA acquisition and versioning regression tests
        run: |
          python scripts/test_lsa_statla_csv.py
          python -m unittest discover -s scripts -p 'test_lsa_pipeline.py' -v
      - name: Run poller in limited mode
        run: |
          python scripts/poll_election.py --election-key 2026-bw --force-run --use-dummy-statla --skip-kommone --limit-ags 50
