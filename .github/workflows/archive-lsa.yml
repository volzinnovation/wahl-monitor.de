name: Archive Sachsen-Anhalt 2026

on:
  # UTC: 18:00 CEST election day through 11:45 CEST on September 8.
  # Each run captures and versions one snapshot. A year guard is below.
  schedule:
    - cron: "*/5 16-23 6 9 *"
    - cron: "*/5 * 7 9 *"
    - cron: "*/15 0-9 8 9 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-2026-lsa
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check collection window
        id: timing
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_REF" != "$DEFAULT_BRANCH" ]; then
            echo "Run this collector on the repository default branch." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          start = datetime(2026, 9, 6, 16, tzinfo=timezone.utc)
          end = datetime(2026, 9, 8, 10, tzinfo=timezone.utc)
          run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or start <= now < end
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run={str(run).lower()}\n")
          PY

      - name: Checkout latest default branch
        if: steps.timing.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        if: steps.timing.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Capture and validate with bounded retries
        if: steps.timing.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p archive
          python -u - <<'PY' 2>&1 | tee archive/collector.log
          import subprocess
          import sys
          import time
          command = [sys.executable, 'scripts/poll_election.py', '--election-key',
                     '2026-lsa', '--force-run', '--skip-kommone', '--no-progress']
          for attempt in range(1, 4):
              print(f'Capture attempt {attempt}/3', flush=True)
              try:
                  result = subprocess.run(command, timeout=180)
                  if result.returncode == 0:
                      subprocess.run([sys.executable, 'scripts/version_lsa_results.py'], check=True)
                      break
              except subprocess.TimeoutExpired:
                  print('Capture exceeded 180 seconds', flush=True)
              if attempt == 3:
                  raise SystemExit('All capture attempts failed; previous results retained')
              time.sleep(20)
          PY

      - name: Commit and push validated result version
        if: steps.timing.outputs.run == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python scripts/version_lsa_results.py --commit --push \
            --branch "$DEFAULT_BRANCH" --recovery-patch archive/result.patch

      - name: Record capture status
        if: always() && steps.timing.outputs.run == 'true'
        env:
          CAPTURE_STATUS: ${{ job.status }}
        run: |
          echo "LSA capture: $CAPTURE_STATUS. Data is versioned in git on successful push." >> "$GITHUB_STEP_SUMMARY"
          echo "Raw attempts, checksums, logs, and any recovery patch are in the run artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve diagnostics and recovery data even on failure
        if: always() && steps.timing.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lsa-2026-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            archive/
            data/2026-lsa/latest/
            data/2026-lsa/raw/statla/
            data/2026-lsa/history.sqlite
            config/2026-lsa.json
          if-no-files-found: error
          retention-days: 90
