name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Archived commit SHA to restore (blank uses latest data)"
        required: false
        type: string
  workflow_run:
    workflows: ["Archive Sachsen-Anhalt 2026"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Validate archived source commit
        if: ${{ inputs.source_ref != '' }}
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python - <<'PY'
          import os
          import re
          if not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ["SOURCE_REF"]):
              raise SystemExit("source_ref must be a full 40-character commit SHA")
          PY

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify LSA result schema
        run: python scripts/test_lsa_statla_csv.py

      - name: Build LSA and verify other elections remain byte-identical
        run: python scripts/build_lsa_pages.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 90

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
